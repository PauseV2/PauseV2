<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>OXBase Inventory</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="root" class="hidden">
        <div id="app">
            <div id="clothing-panel" class="panel">
                <div class="panel-header">
                    <span class="panel-icon">👤</span>
                    <h1>Clothing</h1>
                </div>
                <p class="panel-hint">Tap an item to equip or remove it</p>
                <div id="clothing-grid" class="clothing-grid"></div>
            </div>

            <div id="inventory-panel" class="panel">
                <div class="panel-header">
                    <span class="panel-icon">🔒</span>
                    <h1 id="inventory-title">Inventory</h1>
                    <div class="weight-bar-wrap">
                        <div class="weight-bar"><div id="weight-fill" class="weight-fill"></div></div>
                    </div>
                    <span id="weight-text" class="weight-text"></span>
                    <button id="close-btn" class="icon-btn">✕</button>
                </div>

                <div id="tabs" class="tabs"></div>

                <div id="main-grid" class="slot-grid"></div>

                <div class="action-row">
                    <input id="amount-input" type="number" min="1" value="1" />
                    <div class="action-buttons">
                        <button id="use-btn" class="action-btn" disabled>USE</button>
                        <button id="give-btn" class="action-btn" disabled>GIVE</button>
                    </div>
                </div>

                <div id="bottom-panel">
                    <div id="hotbar-section" class="bottom-section">
                        <div class="panel-header">
                            <span class="panel-icon">➖</span>
                            <h1>Hotbar</h1>
                            <span class="panel-hint-right">Press Z to use</span>
                        </div>
                        <div id="hotbar-grid" class="hotbar-grid"></div>
                    </div>

                    <div id="secondary-section" class="bottom-section hidden">
                        <div class="panel-header">
                            <h1 id="secondary-title"></h1>
                            <span id="secondary-weight-text" class="panel-hint-right"></span>
                        </div>
                        <div id="secondary-grid" class="slot-grid"></div>
                    </div>

                    <div id="shop-section" class="bottom-section hidden">
                        <div class="panel-header">
                            <h1 id="shop-title"></h1>
                            <select id="shop-account-select">
                                <option value="cash">Cash</option>
                                <option value="bank">Bank</option>
                            </select>
                        </div>
                        <div id="shop-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <p id="inv-error" class="toast error hidden"></p>
        <p id="inv-notify" class="toast notify hidden"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
