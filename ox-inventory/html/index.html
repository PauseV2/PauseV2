<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>OXBase Inventory</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="root" class="hidden">
        <div id="inventory">
            <div class="inv-header">
                <div class="header-left">
                    <span class="bag-icon">🎒</span>
                    <div class="header-title">
                        <h1>INVENTORY</h1>
                        <div class="weight-line"><span class="lock-icon">🔒</span><span id="header-weight-left"></span></div>
                    </div>
                </div>

                <div class="search-wrap">
                    <input id="search-input" type="text" placeholder="Search item..." />
                </div>

                <div class="header-right">
                    <span class="weight-line"><span class="lock-icon">🔒</span><span id="header-weight-right"></span></span>
                    <button id="close-btn" class="icon-btn">✕</button>
                </div>
            </div>

            <div class="inv-body">
                <div id="player-grid" class="grid"></div>
                <div id="player-list" class="list hidden"></div>

                <div id="context-pane" class="panel">
                    <div id="detail-view">
                        <div class="panel-lock">🔒</div>
                        <div id="detail-icon" class="detail-icon"></div>
                        <h2 id="detail-name"></h2>
                        <div class="weight-line"><span class="lock-icon">🔒</span><span id="detail-weight"></span></div>
                        <p id="detail-description"></p>
                        <div class="qty-stepper">
                            <button id="qty-minus">–</button>
                            <input id="qty-input" type="number" min="1" value="1" />
                            <button id="qty-plus">+</button>
                        </div>
                        <button id="use-item-btn" class="primary-btn">Use item</button>
                    </div>

                    <div id="secondary-view" class="hidden">
                        <h2 id="context-title"></h2>
                        <div id="context-weight-wrap" class="weight-wrap">
                            <div class="weight-bar"><div id="context-weight-fill" class="weight-fill"></div></div>
                            <span id="context-weight-text"></span>
                        </div>
                        <div id="context-grid" class="grid"></div>
                    </div>

                    <div id="shop-view" class="hidden">
                        <h2 id="shop-title"></h2>
                        <div id="shop-list"></div>
                    </div>

                    <div id="empty-view" class="hidden">
                        <p class="empty-hint">Select an item to view details.</p>
                    </div>
                </div>
            </div>

            <div class="inv-footer">
                <div class="footer-group">
                    <button id="use-btn" class="footer-btn" disabled>🤚 Use</button>
                    <button id="drop-btn" class="footer-btn" disabled>🗑 Drop</button>
                </div>

                <div class="footer-group view-toggle">
                    <button id="view-grid-btn" class="view-btn active">▦</button>
                    <button id="view-list-btn" class="view-btn">☰</button>
                </div>

                <div class="footer-group">
                    <button id="split-btn" class="footer-btn" disabled>⇄ Split</button>
                    <button id="give-btn" class="footer-btn" disabled>👤 Give</button>
                </div>
            </div>

            <p id="inv-error" class="toast error hidden"></p>
            <p id="inv-notify" class="toast notify hidden"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
