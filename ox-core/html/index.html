<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>OXBase Character Select</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="root" class="hidden">
        <h1>OXBase</h1>

        <div id="slots"></div>

        <form id="create-form" class="hidden">
            <h2>New Character</h2>
            <input type="text" name="firstname" placeholder="First name" required />
            <input type="text" name="lastname" placeholder="Last name" required />
            <input type="text" name="birthdate" placeholder="DD/MM/YYYY" required />
            <select name="gender" required>
                <option value="" disabled selected>Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <input type="text" name="nationality" placeholder="Nationality" />
            <div class="form-actions">
                <button type="submit">Create</button>
                <button type="button" id="cancel-create">Cancel</button>
            </div>
        </form>

        <p id="error" class="hidden"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
